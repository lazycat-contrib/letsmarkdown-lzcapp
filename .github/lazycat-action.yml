version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/letsmarkdown.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: letsmarkdown
    bump: patch

build:
  run_buildscript: false

images:
  - id: letsmarkdown
    target: service
    service: letsmarkdown
    source: cveinnt/letsmarkdown
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: LetsMarkdown
    summary: 简单易用的轻量级 markdown 文档协作工具
