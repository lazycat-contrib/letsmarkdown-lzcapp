lzc-sdk-version: "0.1"
name: LetsMarkdown
package: cloud.lazycat.app.letsmarkdown
version: 0.0.1
description: 一个简单易用的轻量级 markdown 文档协作工具
homepage: https://github.com/Cveinnt/LetsMarkdown.com
author: Cveinnt
application:
  subdomain: letsmarkdown
  background_task: false
  multi_instance: false
  gpu_accel: false
